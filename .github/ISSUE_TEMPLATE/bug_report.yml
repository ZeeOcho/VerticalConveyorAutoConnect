name: Bug report
description: Report an auto-connect, flow-direction, tier, or blueprint-placement problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough topology information to reproduce the boundary.

  - type: input
    id: game_version
    attributes:
      label: Satisfactory version/build
      placeholder: "Example: 1.2 / CL ..."
    validations:
      required: true

  - type: input
    id: sml_version
    attributes:
      label: SML version
      placeholder: "Example: 3.12.0"
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Mod version
      placeholder: "Example: 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: topology
    attributes:
      label: Boundary topology
      options:
        - Floor Hole ↔ Floor Hole
        - Floor Hole ↔ Splitter/Merger
        - Splitter/Merger ↔ Floor Hole
        - Other / modded attachment
    validations:
      required: true

  - type: dropdown
    id: flow
    attributes:
      label: Intended item flow
      options:
        - Upward
        - Downward
        - Unknown
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Blueprint/world setup
      description: |
        Which endpoint is in the blueprint? Which is already in the world?
        What lift tier(s) are adjacent? Is there another endpoint in the same vertical column?
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Expected vs actual result
    validations:
      required: true

  - type: textarea
    id: vanilla
    attributes:
      label: Equivalent vanilla behavior
      description: |
        If practical, describe whether the same endpoints can be connected manually with a vanilla Conveyor Lift.

  - type: textarea
    id: log
    attributes:
      label: FactoryGame.log
      description: |
        Drag the relevant log file here. For detailed diagnostics, enable
        LogVerticalConveyorAutoConnect=Verbose.
    validations:
      required: true
