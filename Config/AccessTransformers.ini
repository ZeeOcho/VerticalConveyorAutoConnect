[AccessTransformers]
; Register the custom connection manager before the vanilla blueprint hologram
; initializes its manager list.
Friend=(Class="AFGBlueprintHologram", FriendClass="FVerticalConveyorAutoConnectModule")

; Reuse the blueprint hologram's duplicated connection components and vanilla
; automatic-connection representation instead of creating a mod-specific icon.
Friend=(Class="AFGBlueprintHologram", FriendClass="FBlueprintVerticalConveyorConnectionManager")

; Configure a real conveyor-lift hologram as an automatic blueprint bridge.
Friend=(Class="AFGConveyorLiftHologram", FriendClass="FBlueprintVerticalConveyorConnectionManager")

; Hook lift validation to suppress the proven transient InvalidFloor result on
; tagged synthetic blueprint-child lifts.
Friend=(Class="AFGConveyorLiftHologram", FriendClass="FVerticalConveyorAutoConnectModule")

; Verify and finalize the generated lift before blueprint buildables receive BeginPlay.
Friend=(Class="AFGBuildableConveyorLift", FriendClass="FBlueprintVerticalConveyorConnectionManager")

; Read-only next-tick diagnostics compare the generated lift's saved chain actor
; with the conveyor tick group that owns it. No subsystem state is modified.
Friend=(Class="AFGBuildableSubsystem", FriendClass="FBlueprintVerticalConveyorConnectionManager")

; Restore a freshly constructed blueprint attachment's persisted connection
; direction before the bridge child is configured, because bridge construction
; precedes attachment BeginPlay.
Friend=(Class="AFGBuildableConveyorAttachment", FriendClass="FBlueprintVerticalConveyorConnectionManager")
